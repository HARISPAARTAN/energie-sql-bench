id: q018
split: test
tier: T1
tags: [preis, zaehlen, schwelle]
de: "Wie viele Stunden mit einem Day-Ahead-Preis über 200 €/MWh gab es 2023 in DE-LU?"
en: "How many hours with a day-ahead price above 200 EUR/MWh were there in DE-LU in 2023?"
expect: rows
ordered: false
gold_sql: |
  SELECT COUNT(*) AS stunden
  FROM dw.fact_preis p
  JOIN dw.dim_region r ON r.region_key = p.region_key
  WHERE r.smard_code = N'DE-LU'
    AND p.datum_key BETWEEN 20230101 AND 20231231
    AND p.day_ahead_eur_mwh > 200
check_sql: |
  SELECT SUM(CASE WHEN v.day_ahead_eur_mwh > 200 THEN 1 ELSE 0 END) AS n
  FROM rpt.v_preis v
  JOIN rpt.v_dim_datum d ON d.datum_key = v.datum_key
  WHERE v.region_key = 1 AND d.jahr = 2023
tables: [dw.dim_region, dw.fact_preis]
duckdb: ok
notes: "Echt größer 200. Wert 2026-10-25: 112."
