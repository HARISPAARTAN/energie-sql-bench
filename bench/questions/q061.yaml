id: q061
split: dev
tier: T1
tags: [last, maximum]
de: "Wie hoch war der größte Viertelstundenwert der Residuallast in DE-LU im Jahr 2023 (MWh)?"
en: "What was the largest quarter-hour value of the residual load in DE-LU in 2023 (MWh)?"
expect: rows
ordered: false
gold_sql: |
  SELECT MAX(l.residuallast_mwh) AS max_residuallast_mwh
  FROM dw.fact_last l
  JOIN dw.dim_region r ON r.region_key = l.region_key
  WHERE r.smard_code = N'DE-LU'
    AND l.datum_key BETWEEN 20230101 AND 20231231
check_sql: |
  SELECT MAX(v.residuallast_mwh) AS m
  FROM rpt.v_last v
  JOIN rpt.v_dim_datum d ON d.datum_key = v.datum_key
  WHERE v.region_key = 1 AND d.jahr = 2023
tables: [dw.dim_region, dw.fact_last]
duckdb: ok
notes: "Wert 2026-10-25: 17218.750."
