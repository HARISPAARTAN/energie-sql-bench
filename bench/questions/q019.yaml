id: q019
split: test
tier: T1
tags: [last, maximum]
de: "Welcher Netzlast-Höchstwert (MWh je Viertelstunde) wurde 2024 in DE-LU gemessen?"
en: "What was the peak grid load (MWh per quarter-hour) recorded in DE-LU in 2024?"
expect: rows
ordered: false
gold_sql: |
  SELECT MAX(l.netzlast_mwh) AS max_netzlast_mwh
  FROM dw.fact_last l
  JOIN dw.dim_region r ON r.region_key = l.region_key
  WHERE r.smard_code = N'DE-LU'
    AND l.datum_key BETWEEN 20240101 AND 20241231
check_sql: |
  SELECT TOP 1 v.netzlast_mwh AS spitzenlast
  FROM rpt.v_last v
  JOIN rpt.v_dim_datum d ON d.datum_key = v.datum_key
  WHERE v.region_key = 1 AND d.jahr = 2024
  ORDER BY v.netzlast_mwh DESC
tables: [dw.dim_region, dw.fact_last]
duckdb: ok
notes: "Viertelstundenwert, keine Stundensumme. Wert 2026-10-25: 19140.000."
