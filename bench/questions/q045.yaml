id: q045
split: test
tier: T3
tags: [pumpspeicher, netto, fanout]
de: "Wie hoch war 2025 die Nettoerzeugung der Pumpspeicher in DE-LU, also Erzeugung minus Pumpstromverbrauch (MWh)?"
en: "What was the net generation of pumped storage in DE-LU in 2025, i.e. generation minus pumping consumption (MWh)?"
expect: rows
ordered: false
gold_sql: |
  SELECT
    (SELECT SUM(f.erzeugung_mwh)
     FROM dw.fact_erzeugung f
     JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
     JOIN dw.dim_region r ON r.region_key = f.region_key
     WHERE r.smard_code = N'DE-LU'
       AND e.name_de = N'Pumpspeicher'
       AND f.datum_key BETWEEN 20250101 AND 20251231)
    -
    (SELECT SUM(l.pumpspeicher_verbrauch_mwh)
     FROM dw.fact_last l
     JOIN dw.dim_region r ON r.region_key = l.region_key
     WHERE r.smard_code = N'DE-LU'
       AND l.datum_key BETWEEN 20250101 AND 20251231) AS netto_erzeugung_mwh
check_sql: |
  SELECT SUM(ISNULL(e.erzeugung_mwh, 0) - ISNULL(l.pumpspeicher_verbrauch_mwh, 0)) AS netto
  FROM (SELECT ts_utc, erzeugung_mwh FROM rpt.v_erzeugung
        WHERE region_key = 1 AND energietraeger_key = 11
          AND ts_utc >= '2024-12-31T23:00:00' AND ts_utc < '2025-12-31T23:00:00') e
  FULL JOIN (SELECT ts_utc, pumpspeicher_verbrauch_mwh FROM rpt.v_last
             WHERE region_key = 1
               AND ts_utc >= '2024-12-31T23:00:00' AND ts_utc < '2025-12-31T23:00:00') l
    ON l.ts_utc = e.ts_utc
tables: [dw.dim_energietraeger, dw.dim_region, dw.fact_erzeugung, dw.fact_last]
duckdb: ok
notes: "Zwei getrennte Summen; ein Join der Fakten vor dem Summieren ist fehleranfällig. Ergebnis negativ. Wert 2026-10-25: -2795520.640."
