id: q023
split: test
tier: T2
tags: [erzeugung, synonym]
de: "Wie viel Solarstrom wurde 2024 in DE-LU erzeugt (MWh)?"
en: "How much solar power was generated in DE-LU in 2024 (MWh)?"
expect: rows
ordered: false
gold_sql: |
  SELECT SUM(f.erzeugung_mwh) AS erzeugung_mwh
  FROM dw.fact_erzeugung f
  JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
  JOIN dw.dim_region r ON r.region_key = f.region_key
  WHERE r.smard_code = N'DE-LU'
    AND e.name_de = N'Photovoltaik'
    AND f.datum_key BETWEEN 20240101 AND 20241231
check_sql: |
  SELECT SUM(v.erzeugung_mwh) AS summe
  FROM rpt.v_erzeugung v
  JOIN rpt.v_dim_datum d ON d.datum_key = v.datum_key
  WHERE v.region_key = 1 AND v.energietraeger_key = 1 AND d.jahr = 2024
tables: [dw.dim_energietraeger, dw.dim_region, dw.fact_erzeugung]
duckdb: ok
notes: "Synonym: Solar = Photovoltaik. Wert 2026-10-25: 63444102.750."
