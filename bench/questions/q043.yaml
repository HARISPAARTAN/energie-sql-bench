id: q043
split: test
tier: T3
tags: [lokalzeit, uhrzeit]
de: "Wie viel Strom (MWh) erzeugte Wind Onshore in DE-LU im Januar 2025 zwischen 0 und 6 Uhr Ortszeit (Viertelstunden ab 0:00 bis vor 6:00)?"
en: "How much electricity (MWh) did onshore wind generate in DE-LU in January 2025 between 0:00 and 6:00 local time (quarter-hours from 0:00 up to before 6:00)?"
expect: rows
ordered: false
gold_sql: |
  SELECT SUM(f.erzeugung_mwh) AS erzeugung_mwh
  FROM dw.fact_erzeugung f
  JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
  JOIN dw.dim_region r ON r.region_key = f.region_key
  JOIN dw.dim_zeit z ON z.zeit_key = f.zeit_key
  WHERE r.smard_code = N'DE-LU'
    AND e.name_de = N'Wind Onshore'
    AND f.datum_key BETWEEN 20250101 AND 20250131
    AND z.stunde < 6
check_sql: |
  SELECT SUM(v.erzeugung_mwh) AS summe
  FROM rpt.v_erzeugung v
  WHERE v.region_key = 1
    AND v.energietraeger_key = 2
    AND v.ts_utc >= '2024-12-31T23:00:00' AND v.ts_utc < '2025-01-31T23:00:00'
    AND DATEPART(hour, DATEADD(hour, 1, v.ts_utc)) < 6
tables: [dw.dim_energietraeger, dw.dim_region, dw.dim_zeit, dw.fact_erzeugung]
duckdb: ok
notes: "Januar = Winterzeit, Ortszeit = UTC + 1; dim_zeit.stunde < 6. Wert 2026-10-25: 3302234.000."
