id: q017
split: test
tier: T1
tags: [last, pumpspeicher]
de: "Wie viel Strom verbrauchten Pumpspeicherkraftwerke in DE-LU im Jahr 2025 (MWh)?"
en: "How much electricity did pumped-storage plants consume in DE-LU in 2025 (MWh)?"
expect: rows
ordered: false
gold_sql: |
  SELECT SUM(l.pumpspeicher_verbrauch_mwh) AS pumpspeicher_verbrauch_mwh
  FROM dw.fact_last l
  JOIN dw.dim_region r ON r.region_key = l.region_key
  WHERE r.smard_code = N'DE-LU'
    AND l.datum_key BETWEEN 20250101 AND 20251231
check_sql: |
  SELECT SUM(v.pumpspeicher_verbrauch_mwh) AS summe
  FROM rpt.v_last v
  JOIN rpt.v_dim_datum d ON d.datum_key = v.datum_key
  WHERE v.region_key = 1 AND d.jahr = 2025
tables: [dw.dim_region, dw.fact_last]
duckdb: ok
notes: "Verbrauch steht in fact_last.pumpspeicher_verbrauch_mwh; die Erzeugung der Pumpspeicher in fact_erzeugung ist falsch. Wert 2026-10-25: 12737382.410."
