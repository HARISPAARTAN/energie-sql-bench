id: q015
split: test
tier: T1
tags: [last, residuallast]
de: "Wie hoch war die Summe der Residuallast in DE-LU im Jahr 2023 (MWh)?"
en: "What was the sum of the residual load in DE-LU in 2023 (MWh)?"
expect: rows
ordered: false
gold_sql: |
  SELECT SUM(l.residuallast_mwh) AS residuallast_mwh
  FROM dw.fact_last l
  JOIN dw.dim_region r ON r.region_key = l.region_key
  WHERE r.smard_code = N'DE-LU'
    AND l.datum_key BETWEEN 20230101 AND 20231231
check_sql: |
  SELECT SUM(v.residuallast_mwh) AS summe
  FROM rpt.v_last v
  WHERE v.region_key = 1
    AND v.ts_utc >= '2022-12-31T23:00:00' AND v.ts_utc < '2023-12-31T23:00:00'
tables: [dw.dim_region, dw.fact_last]
duckdb: ok
notes: "Spalte residuallast_mwh, nicht netzlast_mwh. Wert 2026-10-25: 264264789.500."
