id: q030
split: test
tier: T2
tags: [erzeugung, quartal, energietraeger]
de: "Wie viel Strom erzeugten Erdgaskraftwerke in DE-LU in jedem Quartal 2024 (Quartal 1 bis 4 und MWh)?"
en: "How much electricity did natural-gas plants generate in DE-LU in each quarter of 2024 (quarter 1 to 4 and MWh)?"
expect: rows
ordered: false
gold_sql: |
  SELECT d.quartal, SUM(f.erzeugung_mwh) AS erzeugung_mwh
  FROM dw.fact_erzeugung f
  JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
  JOIN dw.dim_region r ON r.region_key = f.region_key
  JOIN dw.dim_datum d ON d.datum_key = f.datum_key
  WHERE r.smard_code = N'DE-LU'
    AND e.name_de = N'Erdgas'
    AND d.jahr = 2024
  GROUP BY d.quartal
check_sql: |
  SELECT (d.monat + 2) / 3 AS q, SUM(v.erzeugung_mwh) AS s
  FROM rpt.v_erzeugung v
  JOIN rpt.v_dim_datum d ON d.datum_key = v.datum_key
  WHERE v.region_key = 1 AND v.energietraeger_key = 7 AND d.jahr = 2024
  GROUP BY (d.monat + 2) / 3
tables: [dw.dim_datum, dw.dim_energietraeger, dw.dim_region, dw.fact_erzeugung]
duckdb: ok
notes: "Lokale Quartale aus dim_datum. Wert 2026-10-25: Quartal 1 17784128.000 MWh, Quartal 4 17599204.500 MWh."
