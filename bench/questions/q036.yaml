id: q036
split: test
tier: T3
tags: [leistung, einheit, jahr]
de: "Welche mittlere Leistung in GW erbrachte Wind Offshore in DE-LU im Jahr 2024?"
en: "What average power in GW did offshore wind provide in DE-LU in 2024?"
expect: rows
ordered: false
gold_sql: |
  SELECT AVG(f.erzeugung_mwh) * 4 / 1000.0 AS avg_leistung_gw
  FROM dw.fact_erzeugung f
  JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
  JOIN dw.dim_region r ON r.region_key = f.region_key
  WHERE r.smard_code = N'DE-LU'
    AND e.name_de = N'Wind Offshore'
    AND f.datum_key BETWEEN 20240101 AND 20241231
check_sql: |
  SELECT SUM(v.erzeugung_mwh) / 8784 / 1000.0 AS gw
  FROM rpt.v_erzeugung v
  WHERE v.region_key = 1
    AND v.energietraeger_key = 3
    AND v.ts_utc >= '2023-12-31T23:00:00' AND v.ts_utc < '2024-12-31T23:00:00'
tables: [dw.dim_energietraeger, dw.dim_region, dw.fact_erzeugung]
duckdb: ok
notes: "AVG(MWh je Viertelstunde) * 4 / 1000; 2024 ohne fehlende Werte, daher gleich Energie / 8784 h. Wert 2026-10-25: 2.922071."
