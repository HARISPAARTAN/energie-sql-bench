id: q041
split: test
tier: T3
tags: [isowoche, einheit]
de: "Wie viel Strom (GWh) erzeugte Wind Offshore in DE-LU in der ISO-Kalenderwoche 40 des Jahres 2025?"
en: "How much electricity (GWh) did offshore wind generate in DE-LU in ISO calendar week 40 of 2025?"
expect: rows
ordered: false
gold_sql: |
  SELECT SUM(f.erzeugung_mwh) / 1000.0 AS erzeugung_gwh
  FROM dw.fact_erzeugung f
  JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
  JOIN dw.dim_region r ON r.region_key = f.region_key
  JOIN dw.dim_datum d ON d.datum_key = f.datum_key
  WHERE r.smard_code = N'DE-LU'
    AND e.name_de = N'Wind Offshore'
    AND d.iso_jahr = 2025 AND d.iso_woche = 40
check_sql: |
  SELECT SUM(v.erzeugung_mwh) / 1000.0 AS gwh
  FROM rpt.v_erzeugung v
  WHERE v.region_key = 1
    AND v.energietraeger_key = 3
    AND v.datum_key BETWEEN 20250929 AND 20251005
tables: [dw.dim_datum, dw.dim_energietraeger, dw.dim_region, dw.fact_erzeugung]
duckdb: ok
notes: "ISO-Woche 40/2025 = 29.09. bis 05.10.2025; iso_jahr, nicht jahr. Wert 2026-10-25: 470.236400."
