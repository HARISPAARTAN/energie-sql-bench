id: q013
split: test
tier: T1
tags: [last, summe]
de: "Wie hoch war die gesamte Netzlast in DE-LU im Jahr 2024 in MWh?"
en: "What was the total grid load in DE-LU in 2024 in MWh?"
expect: rows
ordered: false
gold_sql: |
  SELECT SUM(l.netzlast_mwh) AS netzlast_mwh
  FROM dw.fact_last l
  JOIN dw.dim_region r ON r.region_key = l.region_key
  WHERE r.smard_code = N'DE-LU'
    AND l.datum_key BETWEEN 20240101 AND 20241231
check_sql: |
  SELECT SUM(v.netzlast_mwh) AS summe
  FROM rpt.v_last_stunde v
  WHERE v.region_key = 1
    AND v.stunde_utc >= '2023-12-31T23:00:00' AND v.stunde_utc < '2024-12-31T23:00:00'
tables: [dw.dim_region, dw.fact_last]
duckdb: ok
notes: "Summe der Viertelstundenwerte (MWh je Intervall), nicht der Mittelwert. Wert 2026-10-25: 470397940.840."
