id: q038
split: test
tier: T3
tags: [erzeugung, einheit, kernenergie]
de: "Wie viel Strom erzeugte die Kernenergie in DE-LU im Jahr 2023 in TWh?"
en: "How much electricity did nuclear power generate in DE-LU in 2023, in TWh?"
expect: rows
ordered: false
gold_sql: |
  SELECT SUM(f.erzeugung_mwh) / 1000000.0 AS erzeugung_twh
  FROM dw.fact_erzeugung f
  JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
  JOIN dw.dim_region r ON r.region_key = f.region_key
  WHERE r.smard_code = N'DE-LU'
    AND e.name_de = N'Kernenergie'
    AND f.datum_key BETWEEN 20230101 AND 20231231
check_sql: |
  SELECT SUM(v.erzeugung_mwh) / 1000000.0 AS twh
  FROM rpt.v_erzeugung v
  WHERE v.region_key = 1
    AND v.energietraeger_key = 10
    AND v.ts_utc >= '2022-12-31T23:00:00' AND v.ts_utc < '2023-12-31T23:00:00'
tables: [dw.dim_energietraeger, dw.dim_region, dw.fact_erzeugung]
duckdb: ok
notes: "TWh = MWh / 1.000.000; die Erzeugung endet am 15.04.2023. Wert 2026-10-25: 6.740739."
