id: q039
split: test
tier: T3
tags: [kernenergie, datum, "null"]
de: "An welchem Tag (Ortszeit) erzeugten Kernkraftwerke in DE-LU zuletzt Strom (Erzeugung über 0 MWh)? Gib das Datum aus."
en: "On which day (local time) did nuclear plants in DE-LU last generate electricity (generation above 0 MWh)? Return the date."
expect: rows
ordered: false
gold_sql: |
  SELECT MAX(d.datum) AS letzter_tag
  FROM dw.fact_erzeugung f
  JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
  JOIN dw.dim_region r ON r.region_key = f.region_key
  JOIN dw.dim_datum d ON d.datum_key = f.datum_key
  WHERE r.smard_code = N'DE-LU'
    AND e.name_de = N'Kernenergie'
    AND f.erzeugung_mwh > 0
check_sql: |
  SELECT TOP 1 CAST(v.ts_utc AT TIME ZONE 'UTC' AT TIME ZONE 'W. Europe Standard Time' AS date) AS tag
  FROM rpt.v_erzeugung v
  WHERE v.region_key = 1
    AND v.energietraeger_key = 10
    AND v.erzeugung_mwh > 0
  ORDER BY v.ts_utc DESC
tables: [dw.dim_datum, dw.dim_energietraeger, dw.dim_region, dw.fact_erzeugung]
duckdb: ok
notes: "Spätere Zeilen haben NULL oder 0 (2024 gibt es 526 NULL-Zeilen); MAX(datum_key) ohne Filter ist falsch. Erwartet 2023-04-15. Wert 2026-10-25: 2023-04-15."
