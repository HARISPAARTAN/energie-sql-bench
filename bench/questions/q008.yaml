id: q008
split: test
tier: T4
tags: [inseln, negativ, lokalzeit, ranking]
de: "Wann begann 2025 die längste ununterbrochene Phase negativer Day-Ahead-Preise (Beginn in Ortszeit) und wie viele Stunden dauerte sie? Bei Gleichstand gilt die früheste Phase."
en: "When did the longest uninterrupted run of negative day-ahead prices in 2025 start (start in local time) and how many hours did it last? On a tie, take the earliest run."
expect: rows
ordered: false
gold_sql: |
  SELECT TOP 1 v.start_lokal, v.stunden
  FROM rpt.v_negative_preisphasen v
  JOIN dw.dim_region r ON r.region_key = v.region_key
  WHERE r.smard_code = N'DE-LU'
    AND v.start_datum_key BETWEEN 20250101 AND 20251231
  ORDER BY v.stunden DESC, v.start_utc ASC
check_sql: |
  WITH neg AS (
      SELECT ts_utc,
             CASE WHEN LAG(ts_utc) OVER (ORDER BY ts_utc) = DATEADD(hour, -1, ts_utc) THEN 0 ELSE 1 END AS neu
      FROM dw.fact_preis
      WHERE region_key = 1 AND day_ahead_eur_mwh < 0
  ), grp AS (
      SELECT ts_utc, SUM(neu) OVER (ORDER BY ts_utc ROWS UNBOUNDED PRECEDING) AS g FROM neg
  ), ph AS (
      SELECT MIN(ts_utc) AS start_utc, COUNT(*) AS stunden FROM grp GROUP BY g
  )
  SELECT TOP 1 CAST(start_utc AT TIME ZONE 'UTC' AT TIME ZONE 'W. Europe Standard Time' AS datetime2(0)) AS start_lokal,
         stunden
  FROM ph
  WHERE CAST(start_utc AT TIME ZONE 'UTC' AT TIME ZONE 'W. Europe Standard Time' AS date) BETWEEN '2025-01-01' AND '2025-12-31'
  ORDER BY stunden DESC, start_utc ASC
tables: [dw.dim_region, rpt.v_negative_preisphasen]
duckdb: ok
notes: "Gaps and islands; die Gegenprobe baut die Inseln selbst mit LAG. Beginn in Ortszeit, nicht UTC. Wert 2026-10-25: 2025-10-04 21:00:00, 20 Stunden."
