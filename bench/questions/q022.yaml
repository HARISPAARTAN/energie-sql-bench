id: q022
split: test
tier: T2
tags: [erzeugung, energietraeger, mehrere]
de: "Wie viel Strom lieferte die Windkraft (an Land und auf See zusammen) in DE-LU im Jahr 2025 (MWh)?"
en: "How much electricity did wind power (onshore and offshore combined) deliver in DE-LU in 2025 (MWh)?"
expect: rows
ordered: false
gold_sql: |
  SELECT SUM(f.erzeugung_mwh) AS erzeugung_mwh
  FROM dw.fact_erzeugung f
  JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
  JOIN dw.dim_region r ON r.region_key = f.region_key
  WHERE r.smard_code = N'DE-LU'
    AND e.name_de IN (N'Wind Onshore', N'Wind Offshore')
    AND f.datum_key BETWEEN 20250101 AND 20251231
check_sql: |
  SELECT (SELECT SUM(v.erzeugung_mwh) FROM rpt.v_erzeugung v
          WHERE v.region_key = 1 AND v.energietraeger_key = 2
            AND v.ts_utc >= '2024-12-31T23:00:00' AND v.ts_utc < '2025-12-31T23:00:00')
       + (SELECT SUM(v.erzeugung_mwh) FROM rpt.v_erzeugung v
          WHERE v.region_key = 1 AND v.energietraeger_key = 3
            AND v.ts_utc >= '2024-12-31T23:00:00' AND v.ts_utc < '2025-12-31T23:00:00') AS wind_gesamt
tables: [dw.dim_energietraeger, dw.dim_region, dw.fact_erzeugung]
duckdb: ok
notes: "Wind Onshore plus Wind Offshore in einer Summe. Wert 2026-10-25: 133426222.770."
