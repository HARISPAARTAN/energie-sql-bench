id: q049
split: test
tier: T4
tags: [ranking, tag, gleichstand]
de: "Welche drei Tage (Ortszeit) des Jahres 2025 hatten in DE-LU die höchste Photovoltaik-Erzeugung? Gib Datum und MWh aus, höchster zuerst; bei Gleichstand das frühere Datum."
en: "Which three days (local time) of 2025 had the highest solar PV generation in DE-LU? Return date and MWh, highest first; on a tie, the earlier date."
expect: rows
ordered: true
gold_sql: |
  SELECT TOP 3 d.datum, SUM(f.erzeugung_mwh) AS erzeugung_mwh
  FROM dw.fact_erzeugung f
  JOIN dw.dim_energietraeger e ON e.energietraeger_key = f.energietraeger_key
  JOIN dw.dim_region r ON r.region_key = f.region_key
  JOIN dw.dim_datum d ON d.datum_key = f.datum_key
  WHERE r.smard_code = N'DE-LU'
    AND e.name_de = N'Photovoltaik'
    AND d.jahr = 2025
  GROUP BY d.datum
  ORDER BY SUM(f.erzeugung_mwh) DESC, d.datum ASC
check_sql: |
  WITH tag AS (
      SELECT d.datum AS tag, SUM(v.erzeugung_mwh) AS s
      FROM rpt.v_erzeugung v
      JOIN rpt.v_dim_datum d ON d.datum_key = v.datum_key
      WHERE v.region_key = 1 AND v.energietraeger_key = 1 AND d.jahr = 2025
      GROUP BY d.datum
  ), rk AS (
      SELECT tag, s, ROW_NUMBER() OVER (ORDER BY s DESC, tag ASC) AS rn FROM tag
  )
  SELECT tag, s FROM rk WHERE rn <= 3 ORDER BY rn
tables: [dw.dim_datum, dw.dim_energietraeger, dw.dim_region, dw.fact_erzeugung]
duckdb: ok
notes: "Tagessummen nach lokalem Datum, dann TOP 3. Wert 2026-10-25: 2025-06-20 480581.250 MWh, 2025-06-13 461467.500 MWh, 2025-06-12 458686.500 MWh."
